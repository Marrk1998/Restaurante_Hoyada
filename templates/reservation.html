{% extends "base.html" %}{% block title %}Reserva una mesa | La Hoyada{% endblock %}{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><p class="eyebrow">RESERVACIONES</p><h1 class="display-5 fw-bold">Tu mesa te espera</h1><p class="lead text-secondary">Cuéntanos cuándo vienes y prepararemos todo para recibirte.</p><form class="card border-0 shadow-sm mt-4" method="post"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Nombre completo</label><input class="form-control" id="name" name="name" required></div><div class="col-md-6"><label class="form-label" for="phone">Celular</label><input class="form-control" id="phone" name="phone" type="tel" required></div><div class="col-md-4"><label class="form-label" for="guests">Número de personas</label><input class="form-control" id="guests" name="guests" type="number" min="1" max="30" required></div><div class="col-md-4"><label class="form-label" for="date">Fecha</label><input class="form-control" id="date" name="date" type="date" required></div><div class="col-md-4"><label class="form-label" for="time">Hora</label><input class="form-control" id="time" name="time" type="time" required></div><div class="col-12"><label class="form-label" for="notes">Comentario (opcional)</label><textarea class="form-control" id="notes" name="notes" rows="4"></textarea></div></div><button class="btn btn-brand mt-4">Solicitar reserva</button></div></form></div></div></section>{% endblock %}
